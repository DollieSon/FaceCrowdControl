services:
  server:
    build: .
    ports:
      - "3001:3000"
    depends_on:
      - db
  
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: facecrowdcontrol
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: