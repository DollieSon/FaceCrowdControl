services:
  server:
    build: .
    ports:
      # Published on 127.0.0.1 by default so only this PC can reach the server.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    env_file:
      - path: .env
        required: false
    environment:
      PGHOST: db
    # depends_on:
      # - db
    volumes:
    # for TBOI
      - "${ISAAC_MOD_DATA_DIR:-C:/Manual_D/Steam/steamapps/common/The Binding of Isaac Rebirth/mods/FBCrowdControl/data}:/app/data"

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${PGUSER:-user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-password}
      POSTGRES_DB: ${PGDATABASE:-facecrowdcontrol}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  # For TBOI
